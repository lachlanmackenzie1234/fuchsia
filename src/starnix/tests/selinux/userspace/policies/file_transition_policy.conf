# Type used by the Starnix test container mount configuration.
type test_pkg_file_t;
typeattribute test_pkg_file_t file_like_a;

# Allow unlabeled_t to associate with its own filesystem (e.g. rootfs, /tmp, ramfs).
allow unlabeled_t self:filesystem { associate };

# Define transition for files created in unlabeled filesystems.
type unlabeled_unconfined_file_t;
typeattribute unlabeled_unconfined_file_t file_like_a;
type_transition unconfined_t unlabeled_t:file unlabeled_unconfined_file_t;
